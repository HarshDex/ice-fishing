<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Frozen Lake Spin — a live-show ice fishing wheel game. Play chips only, just for fun.">
<title>Frozen Lake Spin</title>
</head>
<body>
<canvas id="bg"></canvas>
<div class="snow" id="s1"></div>
<div class="snow" id="s2"></div>
<div id="vig"></div>

<div id="app">
  <header>
    <div class="brand">FROZEN LAKE SPIN</div>
    <div class="audio">
      <button id="musicBtn" title="Music on/off">🎵</button>
      <button id="sfxBtn" title="Sound effects on/off">🔊</button>
      <button id="voiceBtn" title="Host voice on/off">🎙️</button>
    </div>
  </header>

  <div id="stage">
    <div class="wheel-wrap" id="wrap">
      <canvas id="wheel3d"></canvas>
    </div>
    <div id="timerBox">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46.5" fill="#06182ecc" stroke="#ffffff22" stroke-width="5"/><circle id="ringArc" cx="50" cy="50" r="46.5" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="292.2" stroke-dashoffset="0"/></svg>
      <div id="timerNum">8</div>
    </div>
    <div id="banner"><small>YOU WIN</small><b id="bannerAmt">0</b></div>
    <div id="toast"></div>
    <div id="status">PLACE YOUR BETS</div>
  </div>

  <div id="dock">
    <div class="dock-in">
      <div id="past"></div>
      <div class="tiles" id="tiles"></div>
      <div class="controls">
        <button class="cbtn" id="auto"><span>🔁</span><small>AUTO</small></button>
        <button class="cbtn" id="rebet"><span>↻</span><small>REPEAT</small></button>
        <div class="chips" id="chips"></div>
        <button class="cbtn" id="undo"><span>↶</span><small>UNDO</small></button>
        <button class="cbtn" id="double"><span>×2</span><small>DOUBLE</small></button>
      </div>
      <div class="statusbar">
        <span>Total bet<b id="total">0</b></span>
        <button id="refill">➕ Add chips</button>
        <span>Balance<b id="balance">100,000</b></span>
      </div>
    </div>
  </div>
</div>

<div id="voiceMenu"></div>
<div id="chipMenu"></div>
<div id="host">
  <div class="host-frame">
    <svg id="hostSvg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMin slice">
      <defs>
        <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2340"/><stop offset=".5" stop-color="#2f6f9c"/><stop offset=".78" stop-color="#9cc9e2"/><stop offset="1" stop-color="#dbeef8"/></linearGradient>
        <filter id="hblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
        <radialGradient id="hskin" cx=".44" cy=".38" r=".72"><stop offset="0" stop-color="#f8dac4"/><stop offset=".5" stop-color="#efc4a5"/><stop offset=".86" stop-color="#d89c7a"/><stop offset="1" stop-color="#b9795a"/></radialGradient>
        <linearGradient id="hneck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5734f"/><stop offset=".4" stop-color="#d9a07e"/><stop offset="1" stop-color="#e8b595"/></linearGradient>
        <linearGradient id="hhair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3524"/><stop offset=".5" stop-color="#3a2016"/><stop offset="1" stop-color="#1c0f08"/></linearGradient>
        <linearGradient id="hhairF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e432d"/><stop offset=".55" stop-color="#3d2217"/><stop offset="1" stop-color="#22130b"/></linearGradient>
        <linearGradient id="hjk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6f98"/><stop offset=".42" stop-color="#93c8e6"/><stop offset=".55" stop-color="#c4e5f6"/><stop offset="1" stop-color="#3f84ad"/></linearGradient>
        <radialGradient id="hiris" cx=".42" cy=".42" r=".62"><stop offset="0" stop-color="#9a7340"/><stop offset=".5" stop-color="#5e3f1f"/><stop offset="1" stop-color="#26170b"/></radialGradient>
        <radialGradient id="hblush" r=".5"><stop offset="0" stop-color="#e57a7a" stop-opacity=".34"/><stop offset="1" stop-color="#e57a7a" stop-opacity="0"/></radialGradient>
        <radialGradient id="hlidshade" r=".5"><stop offset="0" stop-color="#8a5560" stop-opacity=".3"/><stop offset="1" stop-color="#8a5560" stop-opacity="0"/></radialGradient>
        <linearGradient id="hlipU" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9e3c4a"/><stop offset="1" stop-color="#c35867"/></linearGradient>
        <linearGradient id="hlipL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cf6876"/><stop offset="1" stop-color="#a5414e"/></linearGradient>
        <clipPath id="heyes">
          <path d="M114 181 Q120 172.5 129 172 Q138 172.5 143 180 Q137 186.5 128.5 186.5 Q119 186.5 114 181Z"/>
          <path d="M186 181 Q180 172.5 171 172 Q162 172.5 157 180 Q163 186.5 171.5 186.5 Q181 186.5 186 181Z"/>

        <clipPath id="hclipBack"><path d="M150 86 C92 86 74 136 80 196 C84 250 70 300 78 352 C110 362 190 362 222 352 C230 300 216 250 220 196 C226 136 208 86 150 86Z"/></clipPath>
        <clipPath id="hclipFront">

          <path d="M170 126 C196 136 208 160 207 196 C207 236 202 270 212 312 C202 318 190 312 186 300 C194 266 196 236 194 210 C192 182 186 158 168 136Z"/>
          <path d="M96 172 C90 116 114 90 150 89 C188 89 212 116 205 170 C200 150 190 134 172 126 C158 120 144 121 134 128 C120 138 106 152 96 172Z"/>
        </clipPath>
      </defs>
      <!-- studio set, out of focus -->
      <rect width="300" height="400" fill="url(#hbg)"/>
      <g filter="url(#hblur)">
        <path d="M-20 250 L30 196 L74 232 L128 180 L184 228 L236 190 L320 246 L320 400 L-20 400Z" fill="#cfe6f2" opacity=".75"/>
        <circle cx="34" cy="70" r="14" fill="#7fe0ff" opacity=".35"/><circle cx="262" cy="56" r="18" fill="#ffffff" opacity=".3"/>
        <circle cx="250" cy="150" r="10" fill="#7fe0ff" opacity=".4"/><circle cx="44" cy="160" r="9" fill="#ffd9a0" opacity=".35"/>
        <circle cx="282" cy="234" r="12" fill="#ffffff" opacity=".3"/><circle cx="16" cy="250" r="11" fill="#7fe0ff" opacity=".3"/>
      </g>
      <!-- hair behind the shoulders -->
      <g id="hBack">
        <path d="M150 86 C92 86 74 136 80 196 C84 250 70 300 78 352 C110 362 190 362 222 352 C230 300 216 250 220 196 C226 136 208 86 150 86Z" fill="url(#hhair)"/>
        <g id="hStrandB" clip-path="url(#hclipBack)"></g>
        <path d="M208 132 C222 180 216 250 222 336" stroke="#a9dcff" stroke-opacity=".35" stroke-width="2.4" fill="none"/>
        <path d="M92 132 C78 180 84 250 78 336" stroke="#a9dcff" stroke-opacity=".18" stroke-width="2" fill="none"/>
      </g>
      <g id="hBody">
        <path d="M127 234 C127 262 124 284 118 302 L182 302 C176 284 173 262 173 234Z" fill="url(#hneck)"/>
        <path d="M124 244 Q150 276 176 244 L176 268 Q150 286 124 268Z" fill="#7a3d24" opacity=".32"/>
        <path d="M6 400 C10 352 48 318 104 304 C120 300 136 304 150 312 C164 304 180 300 196 304 C252 318 290 352 294 400Z" fill="url(#hjk)"/>
        <g stroke="#1f5c82" stroke-opacity=".35" stroke-width="1.6" fill="none">
          <path d="M22 362 Q70 346 128 356"/><path d="M14 392 Q70 376 132 386"/><path d="M278 362 Q230 346 172 356"/><path d="M286 392 Q230 376 168 386"/>
        </g>
        <path d="M150 332 V400" stroke="#eef6fb" stroke-width="3"/><path d="M150 334 V400" stroke="#5f8299" stroke-width="1.2" stroke-dasharray="2 2"/>
        <path d="M78 318 C92 296 118 292 150 322 C182 292 208 296 222 318 C210 336 188 342 150 340 C112 342 90 336 78 318Z" fill="#e9e1d6"/>
        <g id="hFur"></g>
      </g>
      <g id="hHead">
        <path d="M150 108 C186 108 206 134 205 172 C204 200 198 222 184 240 C172 255 162 263 150 264 C138 263 128 255 116 240 C102 222 96 200 95 172 C94 134 114 108 150 108Z" fill="url(#hskin)"/>
        <!-- contouring and makeup -->
        <path d="M97 190 C100 222 112 244 130 258 C116 250 102 230 97 190Z" fill="#96553a" opacity=".2"/>
        <path d="M203 190 C200 222 188 244 170 258 C184 250 198 230 203 190Z" fill="#96553a" opacity=".2"/>
        <ellipse cx="117" cy="212" rx="16" ry="9" fill="url(#hblush)"/><ellipse cx="183" cy="212" rx="16" ry="9" fill="url(#hblush)"/>
        <ellipse cx="146" cy="138" rx="24" ry="10" fill="#fff2e6" opacity=".22"/>
        <ellipse cx="150" cy="254" rx="10" ry="4" fill="#fff0e4" opacity=".25"/>
        <ellipse cx="129" cy="174" rx="16" ry="7" fill="url(#hlidshade)"/><ellipse cx="171" cy="174" rx="16" ry="7" fill="url(#hlidshade)"/>
        <ellipse cx="129" cy="190" rx="12" ry="3" fill="#a06070" opacity=".1"/><ellipse cx="171" cy="190" rx="12" ry="3" fill="#a06070" opacity=".1"/>
        <!-- eyes -->
        <path d="M114 181 Q120 172.5 129 172 Q138 172.5 143 180 Q137 186.5 128.5 186.5 Q119 186.5 114 181Z" fill="#f2eae6"/>
        <path d="M186 181 Q180 172.5 171 172 Q162 172.5 157 180 Q163 186.5 171.5 186.5 Q181 186.5 186 181Z" fill="#f2eae6"/>
        <g clip-path="url(#heyes)">
          <rect x="110" y="170" width="80" height="5" fill="#7a4a3c" opacity=".28"/>
          <g id="hPupils">
            <circle cx="129" cy="179.4" r="6.4" fill="url(#hiris)"/><circle cx="129" cy="179.4" r="6.4" fill="none" stroke="#1c1008" stroke-width="1"/>
            <circle cx="129" cy="179.4" r="2.7" fill="#0c0806"/><circle cx="131.2" cy="177.3" r="1.5" fill="#fff"/><circle cx="127" cy="182" r=".7" fill="#fff" opacity=".6"/>
            <circle cx="171" cy="179.4" r="6.4" fill="url(#hiris)"/><circle cx="171" cy="179.4" r="6.4" fill="none" stroke="#1c1008" stroke-width="1"/>
            <circle cx="171" cy="179.4" r="2.7" fill="#0c0806"/><circle cx="173.2" cy="177.3" r="1.5" fill="#fff"/><circle cx="169" cy="182" r=".7" fill="#fff" opacity=".6"/>
          </g>
          <rect id="hLidL" x="110" y="169" width="36" height="2" fill="#e4ad8c"/><rect id="hLidR" x="154" y="169" width="36" height="2" fill="#e4ad8c"/>
        </g>
        <g fill="none" stroke-linecap="round">
          <path d="M112.5 181.5 Q119 171.5 129 171 Q139 171.2 144 179.5" stroke="#21110b" stroke-width="2.4"/><path d="M112.5 181.5 L109.3 178.6" stroke="#21110b" stroke-width="1.6"/>
          <path d="M187.5 181.5 Q181 171.5 171 171 Q161 171.2 156 179.5" stroke="#21110b" stroke-width="2.4"/><path d="M187.5 181.5 L190.7 178.6" stroke="#21110b" stroke-width="1.6"/>
          <path d="M115 182.5 Q128 189 142 181" stroke="#7a4636" stroke-opacity=".4" stroke-width="1"/><path d="M185 182.5 Q172 189 158 181" stroke="#7a4636" stroke-opacity=".4" stroke-width="1"/>
          <path d="M115 176 Q127 165 142 172" stroke="#8a5038" stroke-opacity=".35" stroke-width="1.2"/><path d="M185 176 Q173 165 158 172" stroke="#8a5038" stroke-opacity=".35" stroke-width="1.2"/>
        </g>
        <g id="hBrows" fill="#3a2117">
          <path d="M111 167 Q122 157.5 142 161.5 Q143.5 163 142 164.5 Q127 162 113 169.5Z"/><path d="M189 167 Q178 157.5 158 161.5 Q156.5 163 158 164.5 Q173 162 187 169.5Z"/>
        </g>
        <!-- nose -->
        <g fill="none" stroke-linecap="round">
          <path d="M151 178 C151 190 152 200 152 206" stroke="#fff0e4" stroke-opacity=".45" stroke-width="3"/>
          <path d="M144 182 C142 194 140 204 140 210" stroke="#9a5a3e" stroke-opacity=".22" stroke-width="3"/>
          <path d="M141 212 Q139 217 144 219" stroke="#8c4b36" stroke-opacity=".45" stroke-width="1.5"/><path d="M159 212 Q161 217 156 219" stroke="#8c4b36" stroke-opacity=".45" stroke-width="1.5"/>
          <path d="M147 223 L146.5 231 M153 223 L153.5 231" stroke="#a8644c" stroke-opacity=".18" stroke-width="1.2"/>
        </g>
        <ellipse cx="150" cy="211" rx="7" ry="5" fill="#fff0e6" opacity=".35"/>
        <ellipse cx="145.5" cy="217.5" rx="2.6" ry="1.3" fill="#5a281c" opacity=".6"/><ellipse cx="154.5" cy="217.5" rx="2.6" ry="1.3" fill="#5a281c" opacity=".6"/>
        <ellipse cx="150" cy="222" rx="8" ry="2" fill="#9a5a40" opacity=".2"/>
        <!-- mouth (shapes are animated by the host code) -->
        <g transform="translate(150 237)">
          <path id="hMouthIn" d="" fill="#4a1018"/><rect id="hTeeth" x="-9" y="1" width="18" height="0" rx="1.5" fill="#f6f2ee"/>
          <path id="hLipL" d="" fill="url(#hlipL)"/><path id="hLipU" d="" fill="url(#hlipU)"/>
        </g>
        <!-- hair in front of the face -->
        <g fill="url(#hhairF)">
          <path d="M96 172 C90 116 114 90 150 89 C188 89 212 116 205 170 C200 150 190 134 172 126 C158 120 144 121 134 128 C120 138 106 152 96 172Z"/>
          <path d="M128 130 C108 140 96 160 94 196 C92 236 98 270 90 312 C100 318 112 312 116 300 C108 266 106 236 108 210 C110 180 116 156 134 136Z"/>
          <path d="M170 126 C196 136 208 160 207 196 C207 236 202 270 212 312 C202 318 190 312 186 300 C194 266 196 236 194 210 C192 182 186 158 168 136Z"/>
        </g>
        <g id="hStrandF" clip-path="url(#hclipFront)"></g>
        <path d="M112 120 C128 100 168 96 194 116" stroke="#c98a5e" stroke-opacity=".35" stroke-width="7" fill="none" stroke-linecap="round"/>
        <path d="M118 116 C134 101 166 99 188 113" stroke="#f0c39a" stroke-opacity=".28" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M134 128 C140 140 150 146 166 146" stroke="#1c0f08" stroke-opacity=".35" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="host-tag"><i></i>HOST · MIRA</div>
  </div>
  <div id="caption"></div>
</div>

<div id="bonus">
  <div id="bonusTitle">BONUS!</div>
  <canvas id="scene"></canvas>
  <div id="bonusText"></div>
</div>
<canvas id="fx"></canvas>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
