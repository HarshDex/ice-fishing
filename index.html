<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frozen Lake Spin</title>
<style>
  :root { --pw: max(150px, min(20vw, 250px, calc((100vh - 430px) * .75))); --gold: #ffd95a; --ice: #9fe3ff; --cs: clamp(32px, 8.8vw, 48px); --display: Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #030a1a; font-family: "Segoe UI", system-ui, sans-serif; color: #eaf6ff; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .snow { position: fixed; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; background-repeat: repeat; will-change: transform; }
  #s1 { top: -512px; background-size: 512px 512px; animation: fall1 14s linear infinite; }
  #s2 { top: -340px; background-size: 340px 340px; opacity: .55; animation: fall2 23s linear infinite; }
  @keyframes fall1 { to { transform: translate3d(0, 512px, 0); } }
  @keyframes fall2 { to { transform: translate3d(0, 340px, 0); } }
  #vig { position: fixed; inset: 0; z-index: 2; pointer-events: none; opacity: 0; transition: opacity 1.1s; background: radial-gradient(circle at 50% 20%, transparent 22%, #000d 72%); }
  #vig.on { opacity: 1; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 30; }

  #app { position: fixed; inset: 0; z-index: 1; display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; position: relative; z-index: 6; }
  .brand {
    font-family: var(--display); font-size: 1.35rem; letter-spacing: 2px;
    background: linear-gradient(#ffffff 20%, #9fe3ff 55%, #3aa0d0 90%); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .audio { display: flex; gap: 8px; }
  .audio button { width: 34px; height: 34px; border-radius: 50%; border: 1px solid #9fe3ff77; background: #0b2a4d; font-size: 1rem; cursor: pointer; }
  .audio button.off { filter: grayscale(1); opacity: .45; }

  /* stage */
  #stage { flex: 1; min-height: 0; position: relative; }
  .wheel-wrap { position: absolute; z-index: 1; transform-origin: 50% 7%; transition: transform 1.3s cubic-bezier(.3, 0, .2, 1); will-change: transform; }
  .wheel-wrap.tense { transform: scale(1.5); }
  .wheel-wrap::before { content: ""; position: absolute; inset: 1.5%; border-radius: 50%; box-shadow: 0 30px 50px #000d, 0 0 70px 8px #59d8ff33; }
  .layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #iceRing { inset: -13%; width: 126%; height: 126%; pointer-events: none; }
  #rotor { will-change: transform; transform: translateZ(0); }
  #blur { opacity: 0; will-change: opacity; }
  #hl { animation: hlPulse .65s ease-in-out infinite alternate; }
  @keyframes hlPulse { from { opacity: .3; } to { opacity: 1; } }
  #lightsA, #lightsB { display: none; }
  @keyframes blinkA { 0% { opacity: 1; } 50% { opacity: 0; } }
  @keyframes blinkB { 0% { opacity: 0; } 50% { opacity: 1; } }
  .pointer { position: absolute; left: 47.3%; top: 2.9%; width: 5.4%; transform-origin: 50% 18.75%; z-index: 3; will-change: transform; filter: drop-shadow(0 4px 3px #000b); }
  .hubcap {
    position: absolute; left: 50%; top: 50%; width: 17.4%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; z-index: 4;
    display: flex; align-items: center; justify-content: center; text-align: center; line-height: .95;
    background: radial-gradient(circle at 34% 26%, #ffffff 0%, #d4f4ff 14%, #6cc4ea 46%, #1a6a9c 82%, #0a3a5e 100%);
    box-shadow: 0 0 0 2px #04121f, inset 0 -10px 16px #00000077, inset 0 6px 10px #ffffffaa;
    font-family: var(--display); color: #06304f; text-shadow: 0 1px 0 #ffffffbb; letter-spacing: 1px;
  }
  #timerBox { position: absolute; top: 6px; right: 10px; width: 68px; height: 68px; z-index: 3; opacity: 0; transition: opacity .3s; }
  #timerBox.on { opacity: 1; }
  #timerBox svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  #timerNum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-size: 2rem; text-shadow: 0 2px 4px #000; }
  #ringArc { stroke: #3fe08a; }
  #timerBox.hot #ringArc { stroke: #ff5a3c; }
  #timerBox.hot #timerNum { color: #ff8a6b; }
  #status {
    position: absolute; left: 0; right: 0; bottom: 8px; z-index: 3; text-align: center; pointer-events: none;
    font-family: var(--display); font-size: clamp(1.3rem, 5.4vw, 2.3rem); letter-spacing: 3px; color: #fff;
    text-shadow: 0 2px 0 #06182e, 0 0 14px #000, 0 0 30px #06182e;
  }
  #status.res { color: var(--gold); }
  #status.pop { animation: pop .4s; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }
  #toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 4; background: #06182eee; border: 1px solid #9fe3ff66; border-radius: 999px; padding: 6px 16px; font-size: .85rem; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; white-space: nowrap; }
  #toast.on { opacity: 1; }
  #banner {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%) scale(0); z-index: 4; pointer-events: none; text-align: center; white-space: nowrap;
    padding: 12px 34px; border-radius: 18px; background: linear-gradient(#f2fbffee, #a6d8f0ee); border: 3px solid #fff; box-shadow: 0 0 0 4px #3aa0d088, 0 12px 40px #000c; color: #06243f;
  }
  #banner small { display: block; font-weight: 800; letter-spacing: 3px; font-size: .9rem; }
  #banner b { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 9vw, 3.6rem); color: #b97700; text-shadow: 0 2px 0 #fff; }
  #banner.show { animation: bannerIn 2.8s forwards; }
  @keyframes bannerIn {
    0% { transform: translate(-50%, -50%) scale(0); } 10% { transform: translate(-50%, -50%) scale(1.12); } 16% { transform: translate(-50%, -50%) scale(1); }
    85% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -62%) scale(.9); opacity: 0; }
  }

  /* dock */
  #dock { flex: none; position: relative; z-index: 5; padding: 6px 10px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(#051426e8, #030b17 28%); border-top: 1px solid #9fe3ff40; box-shadow: 0 -14px 30px #000a; }
  .dock-in { max-width: 900px; margin: 0 auto; display: grid; gap: 8px; }
  #past { display: flex; gap: 10px; align-items: flex-end; height: 32px; overflow: hidden; padding: 0 4px 2px; }
  #past span { position: relative; flex: none; width: 15px; height: 15px; border-radius: 50%; border: 2px solid #ffffffcc; box-shadow: 0 1px 3px #000; }
  #past span:first-child { width: 20px; height: 20px; box-shadow: 0 0 0 2px #06182e, 0 0 0 4px var(--gold); margin: 0 4px 0 2px; }
  #past em { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); margin-bottom: 3px; font: 800 .62rem/1 "Segoe UI", sans-serif; color: var(--gold); text-shadow: 0 1px 2px #000; }
  .tiles { display: grid; gap: 8px; grid-template-columns: repeat(6, 1fr); grid-template-areas: "snow snow snow ice ice ice" "blue blue orange orange red red" "all all all all all all"; transition: opacity .3s; }
  .controls { display: flex; align-items: center; justify-content: center; gap: 6px; transition: opacity .3s; }
  #dock.closed .tiles, #dock.closed .controls { opacity: .45; pointer-events: none; }
  .tile {
    position: relative; overflow: hidden; cursor: pointer; font-family: inherit; color: #fff; padding: 0;
    border: 1px solid #ffffff88; border-radius: 10px; background: linear-gradient(165deg, var(--c1), var(--c2)); box-shadow: 0 4px 0 #0008, inset 0 1px 0 #fff8;
  }
  .tile:active { transform: translateY(2px); }
  .tile.base { height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: 800; font-size: .95rem; }
  .tile.base svg { width: 28px; height: 28px; }
  .tile.bonus { height: clamp(92px, 14.5vh, 128px); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .tile.bonus canvas { position: absolute; left: 50%; top: 2%; height: 62%; width: auto; transform: translateX(-50%); }
  .tile.bonus b { position: relative; font-family: var(--display); font-weight: 400; font-size: clamp(.9rem, 3.5vw, 1.25rem); letter-spacing: 1px; line-height: 1; margin-bottom: 3px; text-shadow: 0 2px 0 #0009, 0 0 8px #0008; }
  .tile.bonus small { position: relative; width: 100%; background: #0008; font-size: .6rem; letter-spacing: 1px; padding: 2px 0; font-weight: 700; }
  .tile.all { height: 42px; border-color: var(--gold); display: flex; align-items: center; justify-content: center; gap: 10px; font-family: var(--display); letter-spacing: 2px; font-size: 1.05rem; }
  .tile.all svg { width: 34px; height: 30px; }
  .stake {
    position: absolute; top: 4px; right: 4px; min-width: 30px; height: 30px; padding: 0 5px; border-radius: 15px; display: none; align-items: center; justify-content: center; z-index: 2;
    background: radial-gradient(circle at 35% 30%, #fff3b0, #ffb300); color: #3b2200; border: 2px dashed #7a5200; font-weight: 800; font-size: .74rem; box-shadow: 0 2px 5px #0009;
  }
  .tile.win { animation: glow .45s 7 alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 4px var(--gold), 0 0 26px var(--gold); } }
  .cbtn {
    width: var(--cs); height: var(--cs); flex: none; border-radius: 50%; border: 1px solid #9fe3ff66; cursor: pointer; color: #fff;
    background: radial-gradient(circle at 35% 30%, #2d5f8f, #0a2038); box-shadow: 0 3px 0 #0008;
    display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 800; font-size: .95rem; line-height: 1;
  }
  .cbtn small { font-size: .44rem; letter-spacing: .4px; opacity: .85; margin-top: 2px; }
  .cbtn.on { background: radial-gradient(circle at 35% 30%, #7ff5b5, #0f8a48); color: #03230f; box-shadow: 0 0 14px #3fe08a; }
  .cbtn:active { transform: translateY(2px); }
  .chips { display: flex; gap: 6px; margin: 0 4px; }
  .chip {
    --c: #c0392b; width: var(--cs); height: var(--cs); flex: none; border-radius: 50%; border: 0; cursor: pointer; color: #fff; font-weight: 800; font-size: .78rem; text-shadow: 0 1px 2px #000c;
    background: radial-gradient(circle, var(--c) 0 50%, #ffffffdd 51% 55%, transparent 56%), repeating-conic-gradient(#fff 0 18deg, var(--c) 18deg 45deg);
    box-shadow: 0 3px 0 #0008, inset 0 0 0 2px #0004; opacity: .6; transition: transform .15s, opacity .15s;
  }
  .chip.sel { opacity: 1; transform: translateY(-5px) scale(1.1); box-shadow: 0 0 0 3px var(--gold), 0 0 14px #ffd95a99; }
  .statusbar { display: flex; justify-content: space-between; align-items: center; font-size: .8rem; gap: 8px; }
  .statusbar b { color: var(--gold); font-size: 1rem; margin-left: 4px; }
  #refill { border: 1px solid #9fe3ff66; background: #0b2a4d; color: #cfefff; border-radius: 999px; padding: 4px 12px; font-size: .72rem; font-weight: 700; cursor: pointer; }
  @media (min-width: 900px) {
    .tiles { grid-template-columns: .95fr 1fr 1fr 1fr .6fr; grid-template-areas: "snow blue orange red all" "ice blue orange red all"; }
    .tile.base { height: auto; min-height: 54px; font-size: .88rem; gap: 6px; }
    .tile.base .stake { right: auto; left: 4px; }
    .tile.base .mbadge { left: auto; right: 4px; }
    .tile.bonus { height: 124px; }
    .tile.all { height: auto; flex-direction: column; font-size: .95rem; }
  }

  /* multiplier badges on the bet cards */
  .mbadge {
    position: absolute; top: 4px; left: 4px; z-index: 3; display: none; align-items: center; justify-content: center; min-width: 38px; height: 26px; padding: 0 7px; border-radius: 13px;
    background: linear-gradient(#fff6c2, #ffcf2a 55%, #d98a00); border: 2px solid #5a3b00; color: #3b2200; font-family: var(--display); font-size: 1.05rem; letter-spacing: .5px;
    box-shadow: 0 0 14px #ffd95acc, 0 2px 4px #0008; text-shadow: 0 1px 0 #fff8;
  }
  .mbadge.pop { animation: badgeIn .55s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes badgeIn { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
  .tile.boosted { box-shadow: 0 0 0 2px #ffd95a, 0 0 22px #ffd95a88, 0 4px 0 #0008; }
  /* voice picker */
  #voiceMenu { position: fixed; top: 46px; right: 10px; z-index: 40; display: none; flex-direction: column; min-width: 230px; max-width: 88vw; max-height: 62vh; overflow: auto; background: #06182ef7; border: 1px solid #9fe3ff66; border-radius: 12px; padding: 6px; box-shadow: 0 12px 30px #000c; }
  #voiceMenu.on { display: flex; }
  #voiceMenu b { font-size: .7rem; letter-spacing: 1.5px; color: var(--ice); padding: 6px 10px 4px; }
  #voiceMenu button { text-align: left; background: none; border: 0; color: #eaf6ff; padding: 8px 10px; border-radius: 8px; font: 600 .82rem "Segoe UI", sans-serif; cursor: pointer; }
  #voiceMenu button:hover { background: #123a66; }
  #voiceMenu button.sel { background: #1e5a8a; }
  #voiceMenu .vnote { font-size: .7rem; opacity: .7; padding: 6px 10px; line-height: 1.3; }
  /* host */
  #host { position: fixed; z-index: 25; right: 14px; top: 124px; width: var(--pw); pointer-events: none; }
  .host-frame { position: relative; aspect-ratio: 3 / 4; border-radius: 16px; overflow: hidden; border: 3px solid #e9f7ff; box-shadow: 0 0 0 4px #3aa0d066, 0 12px 30px #000c; background: #0d2c55; }
  .host-frame svg { width: 100%; height: 100%; display: block; }
  .host-tag { position: absolute; left: 8px; top: 8px; background: #06182ecc; border-radius: 999px; padding: 3px 9px; font-size: .64rem; font-weight: 800; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .host-tag i { width: 7px; height: 7px; border-radius: 50%; background: #3fe08a; }
  #caption { margin-top: 8px; background: #06182eee; border: 1px solid #9fe3ff66; border-radius: 12px; padding: 8px 10px; font-size: .86rem; font-weight: 600; line-height: 1.25; text-align: center; opacity: 0; transition: opacity .25s; min-height: 2.6em; }
  #caption.on { opacity: 1; }
  @media (max-width: 899px) {
    #host { right: auto; left: 8px; top: 48px; width: 92px; }
    .host-frame { border-width: 2px; border-radius: 12px; }
    .host-tag { font-size: .44rem; padding: 2px 5px; left: 3px; top: 3px; gap: 3px; letter-spacing: .5px; }
    #caption { position: fixed; left: 50%; transform: translateX(-50%); bottom: var(--capB, 300px); width: max-content; max-width: 92vw; margin: 0; font-size: .8rem; padding: 5px 12px; min-height: 0; }
    body.inbonus #caption { bottom: 14px; }
  }
  @media (min-width: 900px) { #bonus { padding-right: calc(var(--pw) + 34px) !important; } }

  /* bonus overlay */
  #bonus { position: fixed; inset: 0; background: radial-gradient(circle, #06203ff2, #01060ff7); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 14px; }
  #bonus.show { display: flex; }
  #bonusTitle {
    font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 6vw, 3rem); letter-spacing: 3px; margin-bottom: 10px;
    background: linear-gradient(#fff7c2, #ffd95a 50%, #f08c00); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #scene { width: min(94vw, 760px, 104vh); border-radius: 18px; border: 3px solid #cfefff; box-shadow: 0 0 0 6px #3aa0d055, 0 20px 50px #000; background: #0b1d3a; }
  #bonusText { min-height: 56px; margin-top: 12px; font-size: 1.1rem; text-align: center; font-weight: 600; }
  #bonusText b { color: var(--gold); }
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div class="snow" id="s1"></div>
<div class="snow" id="s2"></div>
<div id="vig"></div>

<div id="app">
  <header>
    <div class="brand">FROZEN LAKE SPIN</div>
    <div class="audio">
      <button id="musicBtn" title="Music on/off">🎵</button>
      <button id="sfxBtn" title="Sound effects on/off">🔊</button>
      <button id="voiceBtn" title="Host voice on/off">🎙️</button>
    </div>
  </header>

  <div id="stage">
    <div class="wheel-wrap" id="wrap">
      <canvas id="iceRing" class="layer"></canvas>
      <canvas id="frame" class="layer"></canvas>
      <canvas id="lightsA" class="layer"></canvas>
      <canvas id="lightsB" class="layer"></canvas>
      <div id="rotor" class="layer">
        <canvas id="wheel" class="layer"></canvas>
        <canvas id="blur" class="layer"></canvas>
        <canvas id="hl" class="layer"></canvas>
      </div>
      <canvas id="top" class="layer"></canvas>
      <svg class="pointer" id="pointer" viewBox="0 0 60 96">
        <defs>
          <linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#ff9c7a"/><stop offset=".35" stop-color="#f23a1c"/><stop offset=".7" stop-color="#b81a06"/><stop offset="1" stop-color="#6e0d02"/></linearGradient>
          <linearGradient id="ph" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
          <radialGradient id="pm" cx=".35" cy=".3"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#b8c6d2"/><stop offset="1" stop-color="#3f4c59"/></radialGradient>
        </defs>
        <path d="M14 18 Q14 4 30 4 Q46 4 46 18 L35 88 Q30 96 25 88 Z" fill="url(#pg)" stroke="#3d0600" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M19 16 Q20 9 28 8 L27 66 Z" fill="url(#ph)"/>
        <circle cx="30" cy="18" r="9" fill="url(#pm)" stroke="#16222e" stroke-width="2.5"/>
        <circle cx="30" cy="18" r="3" fill="#26333f"/>
      </svg>
      <div class="hubcap" id="hubcap">FROZEN<br>LAKE</div>
    </div>
    <div id="timerBox">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46.5" fill="#06182ecc" stroke="#ffffff22" stroke-width="5"/><circle id="ringArc" cx="50" cy="50" r="46.5" fill="none" stroke-width="7" stroke-linecap="round" stroke-dasharray="292.2" stroke-dashoffset="0"/></svg>
      <div id="timerNum">8</div>
    </div>
    <div id="banner"><small>YOU WIN</small><b id="bannerAmt">0</b></div>
    <div id="toast"></div>
    <div id="status">PLACE YOUR BETS</div>
  </div>

  <div id="dock">
    <div class="dock-in">
      <div id="past"></div>
      <div class="tiles" id="tiles"></div>
      <div class="controls">
        <button class="cbtn" id="auto"><span>🔁</span><small>AUTO</small></button>
        <button class="cbtn" id="rebet"><span>↻</span><small>REPEAT</small></button>
        <div class="chips" id="chips"></div>
        <button class="cbtn" id="undo"><span>↶</span><small>UNDO</small></button>
        <button class="cbtn" id="double"><span>×2</span><small>DOUBLE</small></button>
      </div>
      <div class="statusbar">
        <span>Total bet<b id="total">0</b></span>
        <button id="refill">Refill chips</button>
        <span>Balance<b id="balance">100,000</b></span>
      </div>
    </div>
  </div>
</div>

<div id="voiceMenu"></div>
<div id="host">
  <div class="host-frame">
    <svg id="hostSvg" viewBox="0 0 300 400" preserveAspectRatio="xMidYMin slice">
      <defs>
        <linearGradient id="hbg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2340"/><stop offset=".5" stop-color="#2f6f9c"/><stop offset=".78" stop-color="#9cc9e2"/><stop offset="1" stop-color="#dbeef8"/></linearGradient>
        <filter id="hblur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
        <radialGradient id="hskin" cx=".44" cy=".38" r=".72"><stop offset="0" stop-color="#f8dac4"/><stop offset=".5" stop-color="#efc4a5"/><stop offset=".86" stop-color="#d89c7a"/><stop offset="1" stop-color="#b9795a"/></radialGradient>
        <linearGradient id="hneck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b5734f"/><stop offset=".4" stop-color="#d9a07e"/><stop offset="1" stop-color="#e8b595"/></linearGradient>
        <linearGradient id="hhair" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a3524"/><stop offset=".5" stop-color="#3a2016"/><stop offset="1" stop-color="#1c0f08"/></linearGradient>
        <linearGradient id="hhairF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6e432d"/><stop offset=".55" stop-color="#3d2217"/><stop offset="1" stop-color="#22130b"/></linearGradient>
        <linearGradient id="hjk" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f6f98"/><stop offset=".42" stop-color="#93c8e6"/><stop offset=".55" stop-color="#c4e5f6"/><stop offset="1" stop-color="#3f84ad"/></linearGradient>
        <radialGradient id="hiris" cx=".42" cy=".42" r=".62"><stop offset="0" stop-color="#9a7340"/><stop offset=".5" stop-color="#5e3f1f"/><stop offset="1" stop-color="#26170b"/></radialGradient>
        <radialGradient id="hblush" r=".5"><stop offset="0" stop-color="#e57a7a" stop-opacity=".34"/><stop offset="1" stop-color="#e57a7a" stop-opacity="0"/></radialGradient>
        <radialGradient id="hlidshade" r=".5"><stop offset="0" stop-color="#8a5560" stop-opacity=".3"/><stop offset="1" stop-color="#8a5560" stop-opacity="0"/></radialGradient>

<script>
const DISPLAY = 'Impact, Haettenschweiler, "Arial Narrow Bold", "Arial Black", sans-serif';
const TAU = Math.PI * 2;
const TYPES = {
  snow:   { name: "Snowflake",   c0: "#7fb2cc", c1: "#f9feff", ink: "#134a68", card: ["#f6fcff", "#a3cfe3"], cardInk: "#0d3550" },
  ice:    { name: "Icicle",      c0: "#10405c", c1: "#5db3d8", ink: "#eaf8ff", card: ["#63b9dd", "#1b5475"], cardInk: "#fff" },
  blue:   { name: "Blue Bite",   c0: "#06245a", c1: "#2f8ff0", card: ["#45a6ff", "#0b3f86"], cardInk: "#fff", bonus: [3, 50] },
  orange: { name: "Orange Haul", c0: "#5e2400", c1: "#ff8a1c", card: ["#ffa53d", "#b04800"], cardInk: "#fff", bonus: [5, 150] },
  red:    { name: "Red Giant",   c0: "#4f0404", c1: "#ef2b22", card: ["#ff5244", "#8a0a0a"], cardInk: "#fff", bonus: [10, 400] },
};
const KEYS = Object.keys(TYPES), BONUS_KEYS = KEYS.filter(k => TYPES[k].bonus);

const FISH_D = "M42 0C30-20 0-24-20-6L-44-22C-38-8-38 8-44 22L-20 6C0 24 30 20 42 0Z";
const FIN_D = "M-2-17C6-32 20-30 24-15Z";
const CRYSTAL_D = "M0-30L13-10 8 24 0 34-8 24-13-10Z";
function snowD(r) {
  let d = "";
  for (let k = 0; k < 6; k++) {
    const a = k * Math.PI / 3, c = Math.cos(a), s = Math.sin(a), px = c * r * .58, py = s * r * .58;
    d += "M0 0L" + (c * r).toFixed(1) + " " + (s * r).toFixed(1);
    for (const side of [-1, 1]) {
      const b = a + side * Math.PI / 3;
      d += "M" + px.toFixed(1) + " " + py.toFixed(1) + "L" + (px + Math.cos(b) * r * .34).toFixed(1) + " " + (py + Math.sin(b) * r * .34).toFixed(1);
    }
  }
  return d;
}
const P_FISH = new Path2D(FISH_D), P_FIN = new Path2D(FIN_D), P_CRYSTAL = new Path2D(CRYSTAL_D), P_SNOW = new Path2D(snowD(15));

// 48 segments: 1 Red, 2 Orange, 5 Blue, 20 Snowflake, 20 Icicle  (bonus chance 8/48 ≈ 17%, about 1 spin in 6)
const N = 48, ARC = TAU / N;
const WHEEL = new Array(N).fill(null);
WHEEL[0] = "red"; [16, 32].forEach(i => WHEEL[i] = "orange"); [5, 11, 22, 27, 40].forEach(i => WHEEL[i] = "blue");
let alt = 0;
for (let i = 0; i < N; i++) if (!WHEEL[i]) WHEEL[i] = (alt++ % 2) ? "ice" : "snow";

const CHIPS = [{ v: 10, l: "10", c: "#c0392b" }, { v: 100, l: "100", c: "#1e9e58" }, { v: 500, l: "500", c: "#22313f" }, { v: 1000, l: "1K", c: "#8e44ad" }, { v: 5000, l: "5K", c: "#d35400" }];
const START_BALANCE = 100000, BET_TIME = 8;
const fmt = n => Math.round(n).toLocaleString("en-US");
const short = n => n >= 1000 ? (+(n / 1000).toFixed(1)) + "K" : String(n);
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function seeded(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}

let rot = 0, phase = "idle", balance = START_BALANCE, chip = 100, curHl = null;
let bets = {}, lastBets = {}, mults = {}, past = [], undoStack = [];
let timerEnd = null, timerDur = 0, lastSec = null, auto = false;
KEYS.forEach(k => bets[k] = 0);
const totalBet = () => KEYS.reduce((s, k) => s + bets[k], 0);
const sumOf = o => KEYS.reduce((s, k) => s + (o[k] || 0), 0);

// ================= AUDIO =================
let ac = null, musicG, sfxG, delayN, noiseBuf, nextNote = 0, step = 0;
function pref(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v === "1"; } catch (e) { return d; } }
function savePref(k, v) { try { localStorage.setItem(k, v ? "1" : "0"); } catch (e) {} }
let musicOn = pref("flsMusic", true), sfxOn = pref("flsSfx", true);
function initAudio() {
  if (ac) { if (ac.state === "suspended" && !document.hidden) ac.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  ac = new AC();
  musicG = ac.createGain(); musicG.gain.value = musicOn ? .55 : 0; musicG.connect(ac.destination);
  sfxG = ac.createGain(); sfxG.gain.value = sfxOn ? .8 : 0; sfxG.connect(ac.destination);
  delayN = ac.createDelay(1); delayN.delayTime.value = .36;
  const fb = ac.createGain(); fb.gain.value = .38; delayN.connect(fb); fb.connect(delayN); delayN.connect(musicG);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  nextNote = ac.currentTime + .1; setInterval(scheduler, 80);
}
addEventListener("pointerdown", initAudio); addEventListener("keydown", initAudio);
document.addEventListener("visibilitychange", () => { if (ac) document.hidden ? ac.suspend() : ac.resume(); });
function tone(f, dur, vol, type, when) {
  if (!ac) return null;
  const t = ac.currentTime + (when || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(sfxG); o.start(t); o.stop(t + dur + .03); return o;
}
function hiss(dur, vol, type, freq, q, when) {
  if (!ac) return null;
  const t = ac.currentTime + (when || 0), s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; s.loop = true; f.type = type; f.frequency.setValueAtTime(freq, t); f.Q.value = q || 1;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxG); s.start(t, Math.random() * .5); s.stop(t + dur + .03); return f;
}
function clack(speed, idle) { // flapper slipping off a peg: soft tick when idling, light tick when fast, heavy tock when slow
  if (idle) { hiss(.018, .1, "bandpass", 2300, 3); return; }
  if (speed > 1.6) { hiss(.02, .3 + Math.min(.3, speed / 30), "bandpass", 2600, 3); tone(1400, .014, .04, "square"); }
  else { hiss(.035, .7, "bandpass", 1500, 2.5); tone(430, .07, .22, "triangle"); tone(860, .03, .08, "square"); }
}
function chipSound() { hiss(.03, .35, "bandpass", 4200, 6); tone(2400, .03, .05, "triangle"); hiss(.03, .25, "bandpass", 3600, 6, .045); }
function chime(notes) { notes.forEach((f, i) => { tone(f, .55, .12, "sine", i * .11); tone(f * 2, .3, .03, "sine", i * .11); }); }
function thud() { const o = tone(120, .35, .3, "sine"); if (o) o.frequency.exponentialRampToValueAtTime(45, ac.currentTime + .3); }
function heartbeat() { tone(58, .16, .5, "sine"); tone(52, .2, .4, "sine", .17); }
function splashSound(vol) { const f = hiss(.6, vol, "lowpass", 4500, .7); if (f) f.frequency.exponentialRampToValueAtTime(350, ac.currentTime + .55); }
const duckS = { tense: false, talk: false }; // music dips for the tense finish and, a little, whenever the host speaks
function applyDuck() { if (ac && musicOn) musicG.gain.setTargetAtTime(duckS.tense ? .14 : duckS.talk ? .3 : .55, ac.currentTime, .2); }
function duck(on) { duckS.tense = on; applyDuck(); }

const STEP = .15, mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const CHORDS = [[50, 57, 60, 65, 69], [46, 53, 57, 62, 65], [41, 53, 57, 60, 64], [48, 55, 60, 64, 67]];
const ARP = [0, 1, 2, 3, 2, 1, 3, 2];
function mNote(f, t, dur, vol, type, dest) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + .05);
}
function pad(f, t, dur) {
  const lp = ac.createBiquadFilter(), g = ac.createGain(); lp.type = "lowpass"; lp.frequency.value = 750;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.042, t + .7); g.gain.setValueAtTime(.042, t + dur - .5); g.gain.linearRampToValueAtTime(0, t + dur + .3);
  lp.connect(g); g.connect(musicG);
  for (const det of [-7, 7]) { const o = ac.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.detune.value = det; o.connect(lp); o.start(t); o.stop(t + dur + .35); }
}
function kick(t, vol) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(42, t + .13);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .24);
  o.connect(g); g.connect(musicG); o.start(t); o.stop(t + .26);
}
function hat(t, vol) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 7500;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .05);
  s.connect(f); f.connect(g); g.connect(musicG); s.start(t, Math.random() * .5); s.stop(t + .07);
}
function playStep(s, t) {
  const ch = CHORDS[(s >> 4) % 4], st = s & 15, hot = phase === "spin";
  if (st === 0) for (let i = 1; i < 5; i++) pad(mtof(ch[i]), t, 16 * STEP);
  if (st === 0 || st === 10 || (hot && st === 6)) mNote(mtof(ch[0] - 12), t, .5, .16, "triangle", musicG);
  if (st % 2 === 0) { const n = ch[1 + ARP[st / 2]] + 12; mNote(mtof(n), t, .9, .05, "sine", delayN); mNote(mtof(n), t, .9, .045, "sine", musicG); mNote(mtof(n + 12), t, .35, .012, "sine", musicG); }
  if (st % 8 === 0 || (hot && st % 4 === 0)) kick(t, hot ? .3 : .2);
  if (st % 4 === 2 || hot) hat(t, st % 4 === 2 ? .05 : .025);
}
function scheduler() {
  if (!ac || ac.state !== "running") return;
  if (nextNote < ac.currentTime) nextNote = ac.currentTime + .05;
  while (nextNote < ac.currentTime + .3) { if (musicOn) playStep(step, nextNote); nextNote += STEP; step = (step + 1) % 64; }
}
function renderAudioBtns() { $("musicBtn").classList.toggle("off", !musicOn); $("sfxBtn").classList.toggle("off", !sfxOn); $("voiceBtn").classList.toggle("off", !Host.voiceOn); }
$("voiceBtn").onclick = e => { e.stopPropagation(); initAudio(); const m = $("voiceMenu"); if (m.classList.toggle("on")) Host.fillMenu(m); };
addEventListener("pointerdown", e => { if (!e.target.closest("#voiceMenu, #voiceBtn")) $("voiceMenu").classList.remove("on"); });
$("musicBtn").onclick = () => { musicOn = !musicOn; savePref("flsMusic", musicOn); initAudio(); if (ac) musicG.gain.setTargetAtTime(musicOn ? .55 : 0, ac.currentTime, .05); renderAudioBtns(); };
$("sfxBtn").onclick = () => { sfxOn = !sfxOn; savePref("flsSfx", sfxOn); initAudio(); if (ac) sfxG.gain.setTargetAtTime(sfxOn ? .8 : 0, ac.currentTime, .02); renderAudioBtns(); };

// ================= WHEEL RENDERING (layers, drawn only when something changes) =================
const S = 1200, C = S / 2, R_OUT = 598, R_BEZ = 546, R_FACE = 502, R_SEG = 468, PEG_R = 485, HUB = 152, BULBS = 32, BULB_R = 572;

// ================= WHEEL ENGINE =================
// One fixed-step simulation drives the wheel the whole time:
//   idle – a motor turns it slowly (2.5 rpm) while bets are open and between games
//   spin – it is pushed smoothly from its idle speed up to ~45 rpm, then coasts under friction;
//          each peg has to bend the spring-loaded flapper to get past, so the last pegs can stall it right at the edge
//   hold – parked on the result
const FR_A = .14, FR_B = .3, PEG_K = 13, CONTACT = .34 * ARC, FLAP_LEN = 72, FLAP_K = 19000, FLAP_C = 50, SUB = 1 / 480;
const IDLE_W = TAU * 2.5 / 60, RAMP = 1.5, TENSE_W = 1.0;
const eng = { mode: "idle", w: IDLE_W, t: 0, w0: 0, peak: 0, acc: 0, last: 0, tense: false, beat: null, lastClick: 0, lastIdx: -1, shownRot: NaN };
let fd = 0, fv = 0, fdShown = 1;
function pegGap() { const a = (((-Math.PI / 2 - rot) % TAU) + TAU) % TAU, q = a / ARC; return (q - Math.floor(q)) * ARC; } // angle to the peg about to reach the pointer
function flapStep(gap) {
  fv += (-FLAP_K * fd - FLAP_C * fv) * SUB; fd += fv * SUB;
  if (gap < CONTACT) { const target = -Math.asin(Math.min(1, (CONTACT - gap) * PEG_R / FLAP_LEN)); if (fd > target) { fd = target; if (fv > 0) fv = 0; } }
}
function showFlap() { if (Math.abs(fd - fdShown) > .0005) { fdShown = fd; pointerEl.style.transform = "rotate(" + fd.toFixed(4) + "rad)"; } }
function engStep() { // one 1/480 s step; returns true when a spin has come to rest
  const gap = pegGap();
  if (eng.mode === "idle") eng.w += (IDLE_W - eng.w) * SUB / .8; // motor eases toward 2.5 rpm
  else if (eng.mode === "hold") eng.w = 0;
  else {
    eng.t += SUB;
    if (eng.t < RAMP) { const x = eng.t / RAMP; eng.w = eng.w0 + (eng.peak - eng.w0) * x * x * (3 - 2 * x); }
    else {
      const spring = gap < CONTACT ? -PEG_K * (CONTACT - gap) : 0;
      if (Math.abs(eng.w) < 1e-4 && Math.abs(spring) <= FR_A) { eng.w = 0; return true; }
      const dir = eng.w !== 0 ? Math.sign(eng.w) : Math.sign(spring);
      let nw = eng.w + (spring - dir * (FR_A + FR_B * Math.abs(eng.w))) * SUB;
      if (eng.w !== 0 && Math.sign(nw) !== Math.sign(eng.w) && Math.abs(spring) <= FR_A) nw = 0;
      eng.w = nw;
    }
  }
  rot += eng.w * SUB;
  flapStep(gap);

}
function engTick(now) {
  eng.acc += Math.min(3, (now - eng.last) / 1000); eng.last = now; // keep real time even if frames drop
  let stopped = false;
  while (eng.acc >= SUB) { eng.acc -= SUB; if (engStep()) { stopped = true; eng.acc = 0; break; } }
  if (rot !== eng.shownRot) { eng.shownRot = rot; setRot(); }
  showFlap();
  const idx = indexAtPointer();
  if (idx !== eng.lastIdx) {
    if (eng.lastIdx >= 0 && now - eng.lastClick > 40) { clack(eng.w, eng.mode !== "spin"); eng.lastClick = now; }
    eng.lastIdx = idx;
  }
  if (eng.mode !== "spin") return;
  blurCv.style.opacity = Math.max(0, Math.min(.75, (eng.w - 2.2) / 2.8)).toFixed(3);
  if (!eng.tense && eng.t > RAMP && eng.w < TENSE_W) { // the last few pegs: zoom in on the flapper
    eng.tense = true; $("wrap").classList.add("tense"); $("vig").classList.add("on"); duck(true); Host.emit("SPIN_TENSE");
    heartbeat(); eng.beat = setInterval(heartbeat, 620);
  }

}

  if (phase !== "closed") return;
  phase = "spin"; renderBlur(); $("wrap").classList.add("spinning"); setStatus(""); Host.emit("SPIN_STARTED");
  Object.assign(eng, { mode: "spin", t: 0, w0: eng.w, peak: 4.2 + Math.random() * 1.1, tense: false }); // ~40–50 rpm

    if (S.mode === "drop") { if (S.tm >= 1) { set("bite"); splash(10, 4); splashSound(.15); } }
    else if (S.mode === "bite") { if (S.tm >= 1.5) { set("pull"); splash(50, 9); splashSound(.5); Host.emit("FISH_HOOKED"); } }
    else if (S.mode === "pull") {
      S.v += SPEED[S.stage] * (.5 + .5 * Math.abs(Math.sin(S.tm * 3.4))) * dt;   // heave… heave…
      if (stalls.length && S.v >= stalls[0]) { S.v = stalls.shift(); S.stallDur = .45 + Math.random() * .6; set("stall"); creak(); Host.emit("FISH_STUCK"); }
      else if (S.v >= L) { S.v = L; set("out"); splash(70, 11); splashSound(.6); S.shake = 9; finish(); }
      else if (S.v >= CAP[S.stage]) { S.v = CAP[S.stage]; S.said = false; set("strain"); creak(); }
    }
    else if (S.mode === "stall") { if (S.tm >= S.stallDur) set("pull"); }
    else if (S.mode === "strain") {
      if (S.tm >= .85 && !S.said) { S.said = true; creak(); S.shake = 7; }
      if (Math.random() < .5) splash(1, 6); // water churns while the lifter strains
      if (S.tm >= 1.9) { S.stage++; S.step = 0; set("arrive"); say(CALL[S.stage]); Host.emit("LIFTER_CALLED", { stage: S.stage }); tone(440, .5, .14, "square"); tone(660, .5, .14, "square", .18); }
    }
    else if (S.mode === "arrive") {
      const p = Math.min(1, S.tm / ARRIVE[S.stage]); S.arr[S.stage] = p;
      if (S.stage === 4) { const stp = Math.floor(p * 6); if (stp !== S.step && p < .86) { S.step = stp; thud(); S.shake = 12; } }
      if (p >= 1) { set("pull"); splash(16, 5); tone(520, .12, .12, "triangle"); }
    }
    const holder = S.mode === "arrive" ? S.stage - 1 : S.stage;
    if (holder >= 3) S.heliGo = Math.min(1, S.heliGo + dt / 2.2);
    if (holder >= 4) S.jetGo = Math.min(1, S.jetGo + dt / 2.4);
    drops = drops.filter(d => d.y < HY + 10 || d.vy < 0);
    for (const d of drops) { d.x += d.vx * dt * 60; d.y += d.vy * dt * 60; d.vy += .4 * dt * 60; }
    if (S.mode !== "drop" && S.mode !== "bite" && S.t < 60 && HY - S.v < HY - 6 && Math.random() < .35) drops.push({ x: HX + (Math.random() - .5) * 20 * g, y: HY - Math.random() * S.v * .5, vx: 0, vy: 1, r: 1.6 });
  }
  function draw() {
    const t = S.t, mode = S.mode, out = mode === "out", stuck = mode === "stall" || mode === "strain";
    const holder = mode === "arrive" ? S.stage - 1 : S.stage, fishing = mode !== "drop" && mode !== "bite";
    cableCol = mode === "strain" && Math.sin(t * 42) > 0 ? "#ff6a4a" : "#e6eef5"; // the line flashes red while it strains
    // camera
    const ct = (1 - S.z) / .56, chx = 440 - 60 * ct, chy = 356 + 42 * ct, shx = (Math.random() - .5) * S.shake, shy = (Math.random() - .5) * S.shake;
    sx.setTransform(2 * S.z, 0, 0, 2 * S.z, 2 * (chx - HX * S.z + shx), 2 * (chy - HY * S.z + shy));
    sx.drawImage(sceneBg, WX0, WY0, WW, WH);
    for (let k = 0; k < 3; k++) { const p = (t * .25 + k / 3) % 1; sx.fillStyle = "rgba(255,255,255," + (1 - p) * .3 + ")"; circ(98 + Math.sin(p * 6) * 4 + p * 14, ICE - 46 - p * 42, 4 + p * 8); }
    // where the fish is
    const outLift = out ? 30 * smooth(S.tm / .6) : 0, wob = stuck ? Math.sin(t * 34) * 1.6 : 0;
    const mouthX = HX + (out ? Math.sin(t * 2.2) * 5 : 0), mouthY = HY - S.v - outLift + wob;
    if (out) { // victory rays
      const a = Math.min(1, S.tm * 2), cy = mouthY + L / 2, R = 260 + L;
      const gr = sx.createRadialGradient(mouthX, cy, 10, mouthX, cy, R); gr.addColorStop(0, "rgba(255,225,120," + .5 * a + ")"); gr.addColorStop(1, "rgba(255,225,120,0)");
      sx.save(); sx.translate(mouthX, cy); sx.rotate(t * .4); sx.fillStyle = gr;
      for (let k = 0; k < 12; k++) { sx.rotate(TAU / 12); sx.beginPath(); sx.moveTo(0, 0); sx.lineTo(-R * .1, -R); sx.lineTo(R * .1, -R); sx.closePath(); sx.fill(); }
      sx.restore();
    }
    // machines behind the fish
    const robWalk = S.arr[4] < .86 ? S.arr[4] * Math.PI * 6 : null, robOx = 1000 * (1 - Math.min(1, S.arr[4] / .86)), robBob = robWalk === null ? 0 : -Math.abs(Math.sin(robWalk)) * 14;
    if (S.arr[4] > 0) drawRobotBody(robOx, robBob, robWalk, t);
    if (S.arr[1] > 0) drawCrane(700 * (1 - smooth(S.arr[1])), holder === 1 && fishing, mouthX, mouthY);
    // hole
    // the fish gets fatter as its multiplier climbs, and the ice hole cracks wider to fit it
    const curM = out ? fishMult : Math.min(fishMult, multAt(key, S.v));
    S.th += (thickOf(curM) - S.th) * .12; holeS = hs * Math.max(1, .5 + .5 * S.th);
    sx.fillStyle = "#ffffff"; ell(HX, HY, 80 * holeS, 22 * hs);
    sx.fillStyle = "#b9dcee"; ell(HX, HY + 1, 70 * holeS, 18 * hs);
    sx.fillStyle = "#07314d"; ell(HX, HY + 3, 64 * holeS, 15 * hs);
    const agit = mode === "drop" ? .15 : mode === "bite" ? .4 + S.tm * .3 : out ? .2 : stuck ? 1 : .7;
    for (let k = 0; k < 3; k++) {
      const p = (t * .7 + k / 3) % 1;
      sx.strokeStyle = "rgba(200,240,255," + (1 - p) * agit * .8 + ")"; sx.lineWidth = 1.5;
      sx.beginPath(); sx.ellipse(HX, HY + 3, (8 + p * 50) * holeS, (8 + p * 50) * hs * .23, 0, 0, TAU); sx.stroke();
    }
    drawShards(false);
    // rod state
    const mine = holder === 0;
    const bend = !mine ? 0 : mode === "drop" ? 0 : mode === "bite" ? 6 + S.tm * 9 + Math.sin(t * 38) * S.tm * 3 : stuck ? 37 + Math.sin(t * 40) * 3 : out ? 20 + Math.sin(t * 2.2) * 1.5 : 27 + Math.sin(t * 30) * 2;
    const lean = !mine ? 0 : mode === "bite" ? -.04 * S.tm : stuck ? -.3 : out ? -.1 : mode === "pull" ? -.2 + Math.sin(t * 12) * .02 : 0;
    const tipX = HX - bend * .3, tipY = HY - 256 + bend;
    // bobber or fish
    sx.save(); sx.beginPath(); sx.rect(HX - 700, WY0, 1400, HY + 3 - WY0); sx.clip();
    if (!fishing) {
      const by = mode === "drop" ? tipY + (HY - tipY) * S.tm * S.tm : HY + Math.sin(t * 20) * (1 + S.tm * 3);
      sx.fillStyle = "#fff"; circ(HX, by, 6); sx.fillStyle = "#ff4d2e"; sx.beginPath(); sx.arc(HX, by, 6, Math.PI, 0); sx.fill();
      sx.restore();
      sx.strokeStyle = "#ffffffcc"; sx.lineWidth = 1.2; line(tipX, tipY, HX, Math.min(by, HY + 3) - 6);
    } else {
      const swing = out ? Math.sin(t * 2.2) * .045 : stuck ? Math.sin(t * 26) * .02 : Math.sin(t * 9) * .03;
      drawFish(spr, mouthX, mouthY, g, st, swing, t, out ? 1 : stuck ? 3.4 : 1.8, S.th);
      sx.restore();
      if (mine) { sx.strokeStyle = cableCol; sx.lineWidth = 1.2; line(tipX, tipY, mouthX, mouthY); }
    }
    if (fishing) drawShards(true);
    // fisher + rod
    const hand = drawFisher(lean, !mine && (out || mode === "arrive"));
    sx.lineCap = "round";
    const rod = () => { sx.beginPath(); sx.moveTo(hand.x - 6, hand.y + 18); sx.lineTo(hand.x, hand.y); if (mine) sx.quadraticCurveTo(350, 86, tipX, tipY); else sx.lineTo(hand.x + 30, hand.y - 150); sx.stroke(); };
    sx.strokeStyle = "#2e1b0d"; sx.lineWidth = 4.5; rod(); sx.strokeStyle = "#c98a4b"; sx.lineWidth = 1.5; rod();
    sx.fillStyle = "#1f2f46"; circ(hand.x, hand.y, 7.5);
    // machines in the air
    if (S.arr[2] > 0 && S.heliGo < 1) {
      const p = smooth(S.arr[2]), go = S.heliGo * S.heliGo;
      drawHeli(HX - 700 * (1 - p) - 1000 * go, HY - 440 - 260 * (1 - p) - 420 * go + Math.sin(t * 2.3) * 5, t, holder === 2 && fishing, mouthX, mouthY);
    }
    if (S.arr[3] > 0 && S.jetGo < 1) {
      const p = smooth(S.arr[3]), go = S.jetGo * S.jetGo;
      drawJet(HX + 10 + 1100 * (1 - p) + 1300 * go, HY - 540 - 220 * (1 - p) - 340 * go + Math.sin(t * 1.9) * 4, t, holder === 3 && fishing, mouthX, mouthY);
    }
    if (S.arr[4] > 0) {
      const reach = smooth((S.arr[4] - .86) / .14), rx = ROBOT_X - 190 + robOx + (robWalk === null ? 0 : Math.sin(robWalk + Math.PI) * 60), ry = HY - 170 + robBob;
      drawRobotArm(robOx, robBob, rx + (mouthX + 4 - rx) * reach, ry + (mouthY - 20 - ry) * reach, reach);
    }
    if (fishing) { // gold tag clipped to the fish's lip, showing what the fish is worth right now
      const k = 1 / S.z, tx = mouthX + 34 * k, ty = mouthY - 30 * k, txt = (out ? fishMult : curM) + "x";
      sx.strokeStyle = "#ffe9a8"; sx.lineWidth = 1.6 * k; line(mouthX + 2 * k, mouthY - 2 * k, tx - 20 * k, ty + 8 * k);
      sx.save(); sx.translate(tx, ty); sx.scale(k, k); sx.rotate(Math.sin(t * 3) * .08 - .06);
      const tg = sx.createLinearGradient(0, -15, 0, 15); tg.addColorStop(0, "#fff6c2"); tg.addColorStop(.55, "#ffcf2a"); tg.addColorStop(1, "#d98a00");
      sx.font = "22px " + DISPLAY; const tw = Math.max(52, sx.measureText(txt).width + 22);
      sx.shadowColor = "#ffd95a"; sx.shadowBlur = 14; sx.fillStyle = tg; rr(-tw / 2, -15, tw, 30, 9); sx.shadowBlur = 0;
      sx.strokeStyle = "#5a3b00"; sx.lineWidth = 2.5; sx.beginPath(); sx.roundRect(-tw / 2, -15, tw, 30, 9); sx.stroke();
      sx.fillStyle = "#5a3b00"; circ(-tw / 2 + 7, 0, 2.6);
      sx.fillStyle = "#3b2200"; sx.textAlign = "center"; sx.textBaseline = "middle"; sx.fillText(txt, 4, 1.5);
      sx.restore();
    }
    sx.fillStyle = "#d9f4ff"; for (const d of drops) circ(d.x, d.y, d.r);

    // HUD (screen space)
    sx.setTransform(2, 0, 0, 2, 0, 0);
    sx.fillStyle = "rgba(255,255,255,.75)"; // falling snow and a soft dark edge, in front of the camera
    for (const q of flakes) circ((((q.x + Math.sin(t * .7 + q.y) * 8 - t * 12) % SW) + SW) % SW, (q.y + t * q.v) % SH, q.r);
    const vg = sx.createRadialGradient(360, 230, 190, 360, 230, 480); vg.addColorStop(0, "rgba(0,10,30,0)"); vg.addColorStop(1, "rgba(0,10,30,.55)");
    sx.fillStyle = vg; sx.fillRect(0, 0, SW, SH);
    if (wheelMult > 1) { // the wheel boost rides along for the whole bonus
      const pulse = 1 + Math.sin(t * 4) * .04, mg = sx.createRadialGradient(54, 50, 3, 62, 58, 38);
      mg.addColorStop(0, "#fffbe0"); mg.addColorStop(.45, "#ffd23f"); mg.addColorStop(1, "#b36d00");
      sx.save(); sx.translate(62, 58); sx.scale(pulse, pulse);
      sx.shadowColor = "#ffd95a"; sx.shadowBlur = 20; sx.fillStyle = mg; circ(0, 0, 36); sx.shadowBlur = 0;
      sx.strokeStyle = "#5a3b00"; sx.lineWidth = 3.5; sx.beginPath(); sx.arc(0, 0, 36, 0, TAU); sx.stroke();
      sx.fillStyle = "#3b2200"; sx.textAlign = "center"; sx.textBaseline = "middle"; sx.font = "30px " + DISPLAY; sx.fillText("×" + wheelMult, 0, -2);
      sx.font = "bold 9px 'Segoe UI', sans-serif"; sx.fillText("WHEEL BOOST", 0, 20);
      sx.restore();
    }
    if (!fishing) {
      const msg = mode === "drop" ? "Dropping the line…" : "Something's biting" + ".".repeat(1 + Math.floor(t * 3) % 3);
      sx.font = "bold 17px 'Segoe UI', sans-serif"; sx.textAlign = "center"; sx.textBaseline = "middle";
      sx.fillStyle = "#06243fcc"; rr(528, 160, 200, 40, 20); sx.fillStyle = "#fff"; sx.fillText(msg, 628, 181);
    } else if (!out) {
      drawPlate(Math.min(fishMult, multAt(key, S.v)) + "x", wheelMult > 1 ? "then × wheel " + wheelMult + "x" : "", 1 + (stuck ? Math.sin(t * 30) * .03 : Math.sin(t * 12) * .015));
    } else {
      drawPlate(total + "x", wheelMult > 1 ? "fish " + fishMult + "x  ×  wheel " + wheelMult + "x" : "", 1 + Math.max(0, .35 - S.tm) * .9 + Math.sin(t * 4) * .02);
    }
    const ca = t - S.callT;
    if (S.callout && ca < 2.4) { // shout banner
      const sc2 = 1 + Math.max(0, .25 - ca) * 1.6;
      sx.save(); sx.translate(360, 52); sx.scale(sc2, sc2); sx.globalAlpha = Math.min(1, (2.4 - ca) * 3);
      sx.font = "40px " + DISPLAY; sx.textAlign = "center"; sx.textBaseline = "middle"; sx.lineJoin = "round";
      sx.lineWidth = 9; sx.strokeStyle = "#3d0600"; sx.strokeText(S.callout, 0, 0);
      sx.fillStyle = "#ffd95a"; sx.fillText(S.callout, 0, 0);
      sx.restore();
    }
  }
  let last = performance.now();
  (function frame(now) {
    if (bonusRun !== run) return;
    let dt = Math.min(.25, (now - last) / 1000); last = now;
    S.z += (ZOOM[S.stage] - S.z) * (1 - Math.exp(-dt * 2.2));
    for (; dt > 0; dt -= 1 / 60) update(Math.min(dt, 1 / 60));
    draw();
    if (ac && now - S.snd > 110) { // running sound of whatever is lifting
      S.snd = now;
      if (S.mode === "pull" && S.stage === 0) hiss(.02, .16, "bandpass", 1900, 4);
      if (S.arr[1] > 0 && S.arr[1] < 1) tone(62, .16, .1, "sawtooth");
      if (S.arr[2] > 0 && S.heliGo < 1) hiss(.07, .2, "lowpass", 240, 1);
      if (S.arr[3] > 0 && S.jetGo < 1) hiss(.14, .16, "lowpass", 900, .7);
    }
    requestAnimationFrame(frame);
  })(last);
}

// ================= LAYOUT + MAIN LOOP =================
function layout() {
  const st = $("stage").getBoundingClientRect();
  const hostW = innerWidth >= 900 ? $("host").offsetWidth + 30 : 0; // keep the wheel clear of the host on wide screens
  let availW = st.width, D = Math.max(220, Math.min(st.width * .98, st.height * 1.1, 760));
  if (hostW && (st.width - D) / 2 < hostW) { availW = st.width - hostW; D = Math.max(220, Math.min(availW * .98, st.height * 1.1, 760)); }
  const w = $("wrap");
  w.style.width = w.style.height = D + "px"; w.style.left = (availW - D) / 2 + "px"; w.style.top = Math.max(2, (st.height - D) / 2) + "px";
  $("status").style.right = (st.width - availW) + "px"; $("banner").style.left = availW / 2 + "px"; $("toast").style.left = availW / 2 + "px";
  document.documentElement.style.setProperty("--capB", Math.round(innerHeight - st.bottom + 46) + "px");
  $("hubcap").style.fontSize = (D * .037).toFixed(1) + "px";
  const px = Math.round(Math.min(1400, D * (devicePixelRatio || 1) * 1.3));
  if (Math.abs(px - PX) / px > .06) {
    PX = px; KS = px / S;
    for (const k of ["frame", "la", "lb", "wheel", "hl", "top"]) CV[k].width = CV[k].height = px;
    blurCv.width = blurCv.height = Math.round(px / 2);
    renderAllWheel(); if (phase === "spin") renderBlur();
  }
  fx.width = innerWidth; fx.height = innerHeight;
}
let resizeT = null;
const onResize = () => { clearTimeout(resizeT); resizeT = setTimeout(() => { layout(); drawBg(); }, 120); };
addEventListener("resize", onResize);
if (window.ResizeObserver) new ResizeObserver(onResize).observe($("stage"));
function loop(now) {
  engTick(now); Host.tick(now);
  updateTimer(now);
  drawFx();
  requestAnimationFrame(loop);
}
$("s1").style.backgroundImage = snowTile(512, 46, 31);
$("s2").style.backgroundImage = snowTile(340, 26, 77);
buildDock(); renderAudioBtns(); layout(); drawBg(); setRot();
eng.last = performance.now(); startBetting(); requestAnimationFrame(loop);
</script>
